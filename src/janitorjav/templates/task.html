<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JanitorJAV - {{ task.task_id }}</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,sans-serif; background:#111827; color:#e5e7eb; }
    body { margin:0; padding:24px; } a { color:#93c5fd; } .toolbar,.summary,.asset { background:#1f2937; border:1px solid #374151; border-radius:10px; padding:14px; margin:12px 0; }
    button,select,input { padding:8px; margin:3px; border-radius:6px; border:1px solid #4b5563; background:#111827; color:#fff; }
    button { background:#2563eb; cursor:pointer; border:0; } button.danger { background:#b91c1c; }
    .grid { display:grid; grid-template-columns:28px 1fr auto; gap:12px; align-items:start; }
    .tags span { display:inline-block; background:#374151; border-radius:12px; padding:3px 8px; margin:2px; font-size:12px; }
    .risk { display:inline-block; border-radius:12px; padding:3px 8px; font-size:12px; font-weight:700; } .risk.high { background:#991b1b; } .risk.medium { background:#9a3412; } .risk.low { background:#374151; }
    .evidence-summary { margin:8px 0; padding:8px 10px; background:#111827; border-radius:7px; } .evidence-summary b { color:#fca5a5; } .row-actions { display:flex; flex-direction:column; gap:5px; } .keep { background:#047857; }
    .tabs { display:flex; gap:6px; margin:12px 0; } .tabs button { background:#374151; } .tabs button.active { background:#2563eb; }
    .review-toolbar { position:sticky; top:0; z-index:100; box-shadow:0 8px 18px rgba(0,0,0,.35); }
    [hidden] { display:none !important; }
    .muted { color:#9ca3af; } .frames a { margin-right:8px; } .frames a.flagged { color:#f87171; font-weight:700; } dialog { max-width:92vw; max-height:92vh; background:#111827; color:#fff; border:1px solid #4b5563; }
    dialog img { max-width:85vw; max-height:70vh; display:block; margin:auto; } pre { white-space:pre-wrap; }
  </style>
</head>
<body>
  <p><a href="/">← 返回任务列表</a></p>
  <h1>任务 {{ task.task_id }}</h1>
  <div class="summary" id="summary"></div>
  <div class="tabs">
    <button data-list-status="pending" onclick="setList('pending')">待处理 <span id="count-pending"></span></button>
    <button data-list-status="keep" onclick="setList('keep')">保留 <span id="count-keep"></span></button>
    <button data-list-status="ready_to_quarantine" onclick="setList('ready_to_quarantine')">待隔离 <span id="count-ready_to_quarantine"></span></button>
  </div>
  <div class="toolbar review-toolbar">
    <label><input type="checkbox" id="tagged-only" checked onchange="loadAssets(1)">仅显示带标签</label>
    <select id="page-size" onchange="loadAssets(1)"><option>25</option><option selected>50</option><option>100</option></select>
    <input id="tag-filter" placeholder="标签筛选" onchange="loadAssets(1)">
    <select id="status-filter" onchange="statusFilterChanged()"><option value="">全部状态</option><option value="pending" selected>待处理</option><option value="keep">保留</option><option value="ready_to_quarantine">待隔离</option><option value="quarantined">已隔离</option><option value="quarantine_failed">隔离失败</option><option value="restored">已恢复</option></select>
    <input id="min-duration" type="number" placeholder="最短秒数" onchange="loadAssets(1)"><input id="max-duration" type="number" placeholder="最长秒数" onchange="loadAssets(1)">
    <input id="min-width" type="number" placeholder="最小宽度" onchange="loadAssets(1)"><input id="min-height" type="number" placeholder="最小高度" onchange="loadAssets(1)">
    <span id="task-controls"></span>
    <button id="selection-toggle" onclick="togglePageSelection()">整页全选</button>
    <button id="batch-keep" onclick="review('keep')">批量保留</button><button id="batch-mark" onclick="review('ready_to_quarantine')">批量标记隔离</button>
    <button id="quarantine-selected" class="danger" onclick="quarantine()" hidden>执行所选隔离</button><button id="quarantine-all" class="danger" onclick="quarantineReady()" hidden>执行全部待隔离</button><button id="restore-selected" onclick="restore()" hidden>恢复所选</button>
  </div>
  <div id="assets"></div><div class="toolbar" id="pager"></div>
  <dialog id="preview"><button onclick="preview.close()">关闭</button><img id="preview-image"><pre id="preview-text"></pre></dialog>
<script>
const taskId={{ task.task_id|tojson }}; let currentPage=1; let currentItems=[]; let currentStatusCounts={};
async function api(url, options={}) { const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options}); const d=await r.json(); if(!r.ok) throw new Error(d.detail||JSON.stringify(d)); return d; }
function esc(v){const d=document.createElement('div'); d.textContent=v??''; return d.innerHTML;}
async function refreshStatus(){const t=await api(`/api/tasks/${taskId}`); const active=['running','paused'].includes(t.status); const state=active&&t.stop_requested?'正在安全取消…':active&&t.pause_requested?'正在暂停…':t.status; document.getElementById('summary').innerHTML=`<b>${state}</b>　${t.completed}/${t.discovered}　命中 ${t.tagged}　异常 ${t.errors}　视频并行 ${t.video_workers}<br><span class="muted">${esc(t.current_file||t.error||'')}</span>`; renderTaskControls(t); if(t.status==='running'||active&&t.pause_requested||active&&t.stop_requested)setTimeout(refreshStatus,1000);}
function renderTaskControls(t){let html=''; if(t.status==='running'&&!t.pause_requested&&!t.stop_requested)html='<button onclick="taskControl(\'pause\')">暂停</button><button onclick="taskControl(\'cancel\')">安全取消</button>'; else if(t.status==='paused'&&!t.stop_requested)html='<button onclick="taskControl(\'start\')">继续</button><button onclick="taskControl(\'cancel\')">安全取消</button>'; else if(['created','cancelled','failed'].includes(t.status))html=`<button onclick="taskControl('start')">${t.status==='created'?'开始':'重新开始'}</button>`; else if(t.pause_requested)html='<button disabled>正在暂停…</button>'; else if(t.stop_requested)html='<button disabled>正在安全取消…</button>'; document.getElementById('task-controls').innerHTML=html;}
async function loadAssets(page=currentPage){
  currentPage=page;
  const params=new URLSearchParams({page, page_size:document.getElementById('page-size').value, tagged_only:document.getElementById('tagged-only').checked});
  const fields={tag:'tag-filter',status:'status-filter',min_duration:'min-duration',max_duration:'max-duration',min_width:'min-width',min_height:'min-height'};
  for(const [key,id] of Object.entries(fields)){const value=document.getElementById(id).value;if(value!=='')params.set(key,value)}
  const data=await api(`/api/tasks/${taskId}/assets?${params}`);
  currentItems=data.items;
  currentStatusCounts=data.status_counts||{};
  updateListTabs(currentStatusCounts);
  renderCurrentBatch();
  const pages=Math.max(1,Math.ceil(data.total/data.page_size));
  document.getElementById('pager').innerHTML=`第 ${page}/${pages} 页，共 ${data.total} 条 <button onclick="loadAssets(${Math.max(1,page-1)})">上一页</button><button onclick="loadAssets(${Math.min(pages,page+1)})">下一页</button><input id="page-jump" type="number" min="1" max="${pages}" value="${page}" style="width:72px" onkeydown="if(event.key==='Enter')goToPage(${pages})"><button onclick="goToPage(${pages})">跳转</button>`;
}
function setList(status){document.getElementById('status-filter').value=status; loadAssets(1);}
function statusFilterChanged(){loadAssets(1);}
function updateListTabs(counts){const status=document.getElementById('status-filter').value; document.querySelectorAll('[data-list-status]').forEach(button=>button.classList.toggle('active',button.dataset.listStatus===status)); for(const key of ['pending','keep','ready_to_quarantine'])document.getElementById(`count-${key}`).textContent=`(${counts[key]||0})`; updateActionControls(status);}
function updateActionControls(status){document.getElementById('batch-keep').hidden=!['pending','ready_to_quarantine'].includes(status); document.getElementById('batch-mark').hidden=!['pending','keep'].includes(status); document.getElementById('quarantine-selected').hidden=status!=='ready_to_quarantine'; document.getElementById('quarantine-all').hidden=status!=='ready_to_quarantine'; document.getElementById('restore-selected').hidden=status!=='quarantined';}
function renderCurrentBatch(){document.getElementById('assets').innerHTML=currentItems.map(renderAsset).join('')||'<div class="summary">本批已处理完成，不会自动补充记录。<button onclick="loadAssets(1)">加载下一批</button></div>'; updateSelectionToggle();}
function removeReviewed(ids,targetStatus){const requested=new Set(ids); const moved=new Set(); for(const item of currentItems){if(!requested.has(item.asset_id)||item.review_status===targetStatus)continue; moved.add(item.asset_id); const old=item.review_status; currentStatusCounts[old]=Math.max(0,(currentStatusCounts[old]||0)-1); currentStatusCounts[targetStatus]=(currentStatusCounts[targetStatus]||0)+1;} currentItems=currentItems.filter(item=>!moved.has(item.asset_id)); updateListTabs(currentStatusCounts); renderCurrentBatch();}
function goToPage(pages){const input=document.getElementById('page-jump'); const page=Math.max(1,Math.min(pages,Number.parseInt(input.value,10)||1)); loadAssets(page);}
function renderAsset(a){const videos=a.videos.map(v=>`<div>${esc(v.path)} · ${formatDuration(v.duration_seconds)} · ${v.width||'?'}×${v.height||'?'}</div>`).join(''); const frames=a.videos.flatMap(v=>v.frames.map(f=>`<a class="${f.matches?.length?'flagged':''}" title="${f.matches?.length?'检测到网址或 IP':'未检测到匹配'}" href="#" onclick='showFrame(event,${JSON.stringify(f)})'>${f.timestamp_seconds.toFixed(2)}s</a>`)).join(''); const summaries=(a.evidence_summary||[]).map(s=>`<div class="evidence-summary"><b>${esc(s.text)}</b> × ${s.frame_count} 帧<br><span class="muted">位置：${s.positions.map(esc).join('、')||'未知'}</span>${s.related_text.length?`<br>相关文字：${s.related_text.map(esc).join(' / ')}`:''}</div>`).join(''); const effect=a.directory_effect||{}; const remaining=(effect.remaining_entries||[]).map(esc).join('<br>'); const directoryActions=effect.all_assets_ready?`<div><b>${effect.effectively_empty?'隔离后目录仅剩系统杂项':'目录仍有未归属内容'}</b>${remaining?`<div class="muted">${remaining}</div>`:''}<button class="danger" onclick='directoryAction("quarantine-directory",${JSON.stringify(a.directory)})'>整体隔离目录</button></div>`:''; const restoreAction=a.restore_mode==='directory'?`<button onclick='directoryAction("restore-directory",${JSON.stringify(a.directory)})'>恢复整个目录</button>`:a.restore_mode==='asset'?`<button onclick='restoreAsset(${JSON.stringify(a.asset_id)})'>恢复资产组</button>`:''; const decisions=['pending','keep','ready_to_quarantine'].includes(a.review_status)?`<button class="keep" ${a.review_status==='keep'?'disabled':''} onclick='reviewOne(${JSON.stringify(a.asset_id)},"keep")'>保留</button><button class="danger" ${a.review_status==='ready_to_quarantine'?'disabled':''} onclick='reviewOne(${JSON.stringify(a.asset_id)},"ready_to_quarantine")'>标记隔离</button>`:''; return `<article class="asset grid"><input class="pick" type="checkbox" value="${a.asset_id}" onchange="updateSelectionToggle()"><div><h3>${esc(a.group_key)} <small>${esc(a.review_status)}</small> <span class="risk ${a.risk_label}">风险 ${a.risk_score}</span></h3>${videos}<div class="tags">${a.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="frames">${frames}</div>${summaries}${directoryActions}${restoreAction}</div><div class="row-actions">${decisions}<button onclick='openDir(${JSON.stringify(a.directory)})'>打开目录</button></div></article>`;}
function formatDuration(v){if(v==null)return'?'; const s=Math.round(v); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function selected(){return [...document.querySelectorAll('.pick:checked')].map(x=>x.value)}
function updateSelectionToggle(){const boxes=[...document.querySelectorAll('.pick')]; const allSelected=boxes.length>0&&boxes.every(x=>x.checked); const button=document.getElementById('selection-toggle'); button.textContent=allSelected?'取消选择':'整页全选'; button.disabled=boxes.length===0;}
function togglePageSelection(){const boxes=[...document.querySelectorAll('.pick')]; const allSelected=boxes.length>0&&boxes.every(x=>x.checked); boxes.forEach(x=>x.checked=!allSelected); updateSelectionToggle();}
async function review(status){const ids=selected(); if(!ids.length)return alert('请先选择项目'); await api(`/api/tasks/${taskId}/review`,{method:'POST',body:JSON.stringify({asset_ids:ids,status})}); removeReviewed(ids,status);}
async function reviewOne(assetId,status){await api(`/api/tasks/${taskId}/review`,{method:'POST',body:JSON.stringify({asset_ids:[assetId],status})}); removeReviewed([assetId],status);}
async function quarantine(){const ids=selected(); if(!ids.length)return alert('请先选择项目'); if(!confirm(`确认隔离 ${ids.length} 个审核单元？`))return; const d=await api(`/api/tasks/${taskId}/quarantine`,{method:'POST',body:JSON.stringify({asset_ids:ids})}); if(!d.operations.length)return alert('完成 0 个：所选记录尚未标记为待隔离，或状态已经变化。'); const completed=d.operations.filter(x=>x.status==='completed').map(x=>x.asset_id); const failed=d.operations.length-completed.length; removeReviewed(completed,'quarantined'); alert(`完成 ${completed.length} 个，失败 ${failed} 个`);}
async function quarantineReady(){const query=await api(`/api/tasks/${taskId}/assets?page=1&page_size=1&tagged_only=false&status=ready_to_quarantine`); if(!query.total)return alert('没有已标记待隔离的记录'); if(!confirm(`确认执行全部 ${query.total} 个已标记隔离的审核单元？\n文件将被移动到隔离区。`))return; const d=await api(`/api/tasks/${taskId}/quarantine-ready`,{method:'POST'}); const failed=d.operations.filter(x=>x.status!=='completed').length; alert(`完成 ${d.operations.length-failed} 个，失败 ${failed} 个`); await loadAssets();}
async function restore(){const ids=selected(); if(!ids.length)return alert('请先选择项目'); if(!confirm(`确认恢复 ${ids.length} 个审核单元？`))return; const d=await api(`/api/tasks/${taskId}/restore`,{method:'POST',body:JSON.stringify({asset_ids:ids})}); alert(`完成 ${d.operations.length} 个操作`); await loadAssets();}
async function restoreAsset(assetId){if(!confirm('确认恢复这个资产组？'))return; const d=await api(`/api/tasks/${taskId}/restore`,{method:'POST',body:JSON.stringify({asset_ids:[assetId]})}); alert(`完成 ${d.operations.length} 个操作`); await loadAssets();}
async function directoryAction(action,directory){if(!confirm(`确认对整个目录执行操作？\n${directory}`))return; try{await api(`/api/tasks/${taskId}/${action}`,{method:'POST',body:JSON.stringify({directory})}); await loadAssets();}catch(e){alert(e.message)}}
async function taskControl(action){try{const t=await api(`/api/tasks/${taskId}/${action}`,{method:'POST'}); renderTaskControls(t); await refreshStatus();}catch(e){alert(e.message)}}
async function openDir(path){await api(`/api/tasks/${taskId}/open-directory?path=${encodeURIComponent(path)}`,{method:'POST'});}
function showFrame(event,f){event.preventDefault(); document.getElementById('preview-image').src=`/api/tasks/${taskId}/evidence?path=${encodeURIComponent(f.image_path)}`; document.getElementById('preview-text').textContent=`时间: ${f.timestamp_seconds}s\n来源: ${f.requested_positions.join(', ')}\n置信度: ${f.max_confidence??''}\nOCR:\n${f.ocr_text}\n\n命中:\n${JSON.stringify(f.matches,null,2)}`; document.getElementById('preview').showModal();}
refreshStatus(); loadAssets(1);
</script>
</body>
</html>
