<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JanitorJAV - {{ task.task_id }}</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,sans-serif; background:#111827; color:#e5e7eb; }
    body { margin:0; padding:24px; } a { color:#93c5fd; } .toolbar,.summary,.asset { background:#1f2937; border:1px solid #374151; border-radius:10px; padding:14px; margin:12px 0; }
    button,select,input { padding:8px; margin:3px; border-radius:6px; border:1px solid #4b5563; background:#111827; color:#fff; }
    button { background:#2563eb; cursor:pointer; border:0; } button.danger { background:#b91c1c; }
    .grid { display:grid; grid-template-columns:28px 1fr auto; gap:12px; align-items:start; }
    .tags span { display:inline-block; background:#374151; border-radius:12px; padding:3px 8px; margin:2px; font-size:12px; }
    .muted { color:#9ca3af; } .frames a { margin-right:8px; } dialog { max-width:92vw; max-height:92vh; background:#111827; color:#fff; border:1px solid #4b5563; }
    dialog img { max-width:85vw; max-height:70vh; display:block; margin:auto; } pre { white-space:pre-wrap; }
  </style>
</head>
<body>
  <p><a href="/">← 返回任务列表</a></p>
  <h1>任务 {{ task.task_id }}</h1>
  <div class="summary" id="summary"></div>
  <div class="toolbar">
    <label><input type="checkbox" id="tagged-only" checked onchange="loadAssets(1)">仅显示带标签</label>
    <select id="page-size" onchange="loadAssets(1)"><option>25</option><option selected>50</option><option>100</option></select>
    <input id="tag-filter" placeholder="标签筛选" onchange="loadAssets(1)">
    <select id="status-filter" onchange="loadAssets(1)"><option value="">全部状态</option><option value="pending">待审核</option><option value="keep">确认保留</option><option value="ready_to_quarantine">准备隔离</option><option value="quarantined">已隔离</option><option value="quarantine_failed">隔离失败</option></select>
    <input id="min-duration" type="number" placeholder="最短秒数" onchange="loadAssets(1)"><input id="max-duration" type="number" placeholder="最长秒数" onchange="loadAssets(1)">
    <input id="min-width" type="number" placeholder="最小宽度" onchange="loadAssets(1)"><input id="min-height" type="number" placeholder="最小高度" onchange="loadAssets(1)">
    <button onclick="taskControl('pause')">暂停</button><button onclick="taskControl('start')">继续</button><button onclick="taskControl('cancel')">安全取消</button>
    <button onclick="selectPage(true)">整页全选</button><button onclick="selectPage(false)">取消选择</button>
    <button onclick="review('keep')">确认保留</button><button onclick="review('ready_to_quarantine')">准备隔离</button>
    <button class="danger" onclick="quarantine()">执行隔离</button><button onclick="restore()">恢复</button>
  </div>
  <div id="assets"></div><div class="toolbar" id="pager"></div>
  <dialog id="preview"><button onclick="preview.close()">关闭</button><img id="preview-image"><pre id="preview-text"></pre></dialog>
<script>
const taskId={{ task.task_id|tojson }}; let currentPage=1; let currentItems=[];
async function api(url, options={}) { const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options}); const d=await r.json(); if(!r.ok) throw new Error(d.detail||JSON.stringify(d)); return d; }
function esc(v){const d=document.createElement('div'); d.textContent=v??''; return d.innerHTML;}
async function refreshStatus(){const t=await api(`/api/tasks/${taskId}`); document.getElementById('summary').innerHTML=`<b>${t.status}</b>　${t.completed}/${t.discovered}　命中 ${t.tagged}　异常 ${t.errors}<br><span class="muted">${esc(t.current_file||t.error||'')}</span>`; if(t.status==='running') setTimeout(refreshStatus,2000);}
async function loadAssets(page=currentPage){
  currentPage=page;
  const params=new URLSearchParams({page, page_size:document.getElementById('page-size').value, tagged_only:document.getElementById('tagged-only').checked});
  const fields={tag:'tag-filter',status:'status-filter',min_duration:'min-duration',max_duration:'max-duration',min_width:'min-width',min_height:'min-height'};
  for(const [key,id] of Object.entries(fields)){const value=document.getElementById(id).value;if(value!=='')params.set(key,value)}
  const data=await api(`/api/tasks/${taskId}/assets?${params}`);
  currentItems=data.items;
  document.getElementById('assets').innerHTML=data.items.map(renderAsset).join('')||'<p>暂无结果</p>';
  const pages=Math.max(1,Math.ceil(data.total/data.page_size));
  document.getElementById('pager').innerHTML=`第 ${page}/${pages} 页，共 ${data.total} 条 <button onclick="loadAssets(${Math.max(1,page-1)})">上一页</button><button onclick="loadAssets(${Math.min(pages,page+1)})">下一页</button>`;
}
function renderAsset(a){const videos=a.videos.map(v=>`<div>${esc(v.path)} · ${formatDuration(v.duration_seconds)} · ${v.width||'?'}×${v.height||'?'}</div>`).join(''); const frames=a.videos.flatMap(v=>v.frames.map(f=>`<a href="#" onclick='showFrame(event,${JSON.stringify(f)})'>${f.timestamp_seconds.toFixed(2)}s</a>`)).join(''); const effect=a.directory_effect||{}; const remaining=(effect.remaining_entries||[]).map(esc).join('<br>'); const directoryActions=effect.all_assets_ready?`<div><b>${effect.effectively_empty?'隔离后目录仅剩系统杂项':'目录仍有未归属内容'}</b>${remaining?`<div class="muted">${remaining}</div>`:''}<button class="danger" onclick='directoryAction("quarantine-directory",${JSON.stringify(a.directory)})'>整体隔离目录</button></div>`:''; const restoreDirectory=a.review_status==='quarantined'?`<button onclick='directoryAction("restore-directory",${JSON.stringify(a.directory)})'>恢复整个目录</button>`:''; return `<article class="asset grid"><input class="pick" type="checkbox" value="${a.asset_id}"><div><h3>${esc(a.group_key)} <small>${esc(a.review_status)}</small></h3>${videos}<div class="tags">${a.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="frames">${frames}</div>${directoryActions}${restoreDirectory}</div><button onclick='openDir(${JSON.stringify(a.directory)})'>打开目录</button></article>`;}
function formatDuration(v){if(v==null)return'?'; const s=Math.round(v); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function selected(){return [...document.querySelectorAll('.pick:checked')].map(x=>x.value)} function selectPage(v){document.querySelectorAll('.pick').forEach(x=>x.checked=v)}
async function review(status){const ids=selected(); if(!ids.length)return alert('请先选择项目'); await api(`/api/tasks/${taskId}/review`,{method:'POST',body:JSON.stringify({asset_ids:ids,status})}); await loadAssets();}
async function quarantine(){const ids=selected(); if(!ids.length)return alert('请先选择项目'); if(!confirm(`确认隔离 ${ids.length} 个审核单元？`))return; const d=await api(`/api/tasks/${taskId}/quarantine`,{method:'POST',body:JSON.stringify({asset_ids:ids})}); alert(`完成 ${d.operations.length} 个操作`); await loadAssets();}
async function restore(){const ids=selected(); if(!ids.length)return alert('请先选择项目'); if(!confirm(`确认恢复 ${ids.length} 个审核单元？`))return; const d=await api(`/api/tasks/${taskId}/restore`,{method:'POST',body:JSON.stringify({asset_ids:ids})}); alert(`完成 ${d.operations.length} 个操作`); await loadAssets();}
async function directoryAction(action,directory){if(!confirm(`确认对整个目录执行操作？\n${directory}`))return; try{await api(`/api/tasks/${taskId}/${action}`,{method:'POST',body:JSON.stringify({directory})}); await loadAssets();}catch(e){alert(e.message)}}
async function taskControl(action){try{await api(`/api/tasks/${taskId}/${action}`,{method:'POST'}); await refreshStatus();}catch(e){alert(e.message)}}
async function openDir(path){await api(`/api/tasks/${taskId}/open-directory?path=${encodeURIComponent(path)}`,{method:'POST'});}
function showFrame(event,f){event.preventDefault(); document.getElementById('preview-image').src=`/api/tasks/${taskId}/evidence?path=${encodeURIComponent(f.image_path)}`; document.getElementById('preview-text').textContent=`时间: ${f.timestamp_seconds}s\n来源: ${f.requested_positions.join(', ')}\n置信度: ${f.max_confidence??''}\nOCR:\n${f.ocr_text}\n\n命中:\n${JSON.stringify(f.matches,null,2)}`; document.getElementById('preview').showModal();}
refreshStatus(); loadAssets(1);
</script>
</body>
</html>
