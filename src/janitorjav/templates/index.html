<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JanitorJAV</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#111827; color:#e5e7eb; }
    body { max-width:1100px; margin:0 auto; padding:32px 20px; }
    h1 { margin-bottom:4px; } .muted { color:#9ca3af; }
    .card { background:#1f2937; border:1px solid #374151; border-radius:12px; padding:20px; margin:20px 0; }
    input { width:min(720px, 95%); padding:10px; border-radius:7px; border:1px solid #4b5563; background:#111827; color:#fff; }
    button, .button { display:inline-block; padding:9px 14px; border:0; border-radius:7px; background:#2563eb; color:white; cursor:pointer; text-decoration:none; }
    table { width:100%; border-collapse:collapse; } th,td { padding:10px; border-bottom:1px solid #374151; text-align:left; }
    .error { color:#fca5a5; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>JanitorJAV</h1>
  <p class="muted">本地媒体库扫描与审核</p>
  <section class="card">
    <h2>新建完整扫描</h2>
    <p>输入 Windows 本地目录、映射盘或 UNC 路径。隔离目录将自动创建在扫描根同级。</p>
    <input id="scan-root" placeholder="\\server\media\JAV">
    <label>视频并行数 <input id="video-workers" type="number" min="1" max="8" value="1" style="width:80px"></label>
    <span class="muted">（1–8；同时处理的视频数量）</span>
    <button onclick="createTask()">创建任务</button>
    <p id="create-error" class="error"></p>
  </section>
  <section class="card">
    <h2>历史任务</h2>
    <table><thead><tr><th>创建时间</th><th>扫描目录</th><th>状态</th><th>进度</th><th></th></tr></thead>
      <tbody id="tasks"></tbody>
    </table>
  </section>
<script>
async function json(url, options={}) {
  const response = await fetch(url, {headers:{'Content-Type':'application/json'}, ...options});
  const data = await response.json();
  if (!response.ok) throw new Error(data.detail || JSON.stringify(data));
  return data;
}
async function createTask() {
  const error = document.getElementById('create-error'); error.textContent='';
  try {
    const task = await json('/api/tasks', {method:'POST', body:JSON.stringify({scan_root:document.getElementById('scan-root').value,video_workers:Number(document.getElementById('video-workers').value)})});
    await json(`/api/tasks/${task.task_id}/start`, {method:'POST'});
    location.href = `/tasks/${task.task_id}`;
  } catch (e) { error.textContent=e.message; }
}
async function loadTasks() {
  const tasks = await json('/api/tasks');
  document.getElementById('tasks').innerHTML = tasks.map(t => `<tr><td>${t.created_at}</td><td>${escapeHtml(t.scan_root)}<br><span class="muted">视频并行数：${t.video_workers}</span></td><td>${t.status}</td><td>${t.completed}/${t.discovered}</td><td><a class="button" href="/tasks/${t.task_id}">打开</a> <button onclick="deleteTask('${t.task_id}')">删除记录</button></td></tr>`).join('');
}
async function deleteTask(id){if(!confirm('只删除任务日志和证据，不影响媒体库或隔离区。确认？'))return;try{await json(`/api/tasks/${id}`,{method:'DELETE'});await loadTasks()}catch(e){alert(e.message)}}
function escapeHtml(value) { const d=document.createElement('div'); d.textContent=value; return d.innerHTML; }
loadTasks();
</script>
</body>
</html>
